<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">WireAssume Analysis Flow</title><desc id="desc">Flow from scenario configuration and recording through replay, mutation, oracle outcomes, ddmin, inference, OpenAPI comparison, and contract outputs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a34"/><stop offset="1" stop-color="#020c19"/></linearGradient>
<linearGradient id="brand" x1="0" x2="1"><stop stop-color="#22c7ff"/><stop offset="1" stop-color="#0878ff"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#28c9ff"/></marker>
<style>.t{font-family:Inter,Segoe UI,Arial,sans-serif}.h{fill:#f6fbff;font-weight:800}.s{fill:#91b6da}.box{fill:#06233e;stroke:#168dd5;stroke-width:2}.step{fill:#073153;stroke:#28c9ff;stroke-width:2}.l{fill:#eff8ff;font-weight:700}.m{fill:#9fc3e6;font-size:15px}.n{fill:#06233e;stroke:#5cdeff;stroke-width:3}.line{stroke:#28c9ff;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
</defs>
<rect width="1600" height="900" rx="24" fill="url(#bg)"/>
<g class="t"><text x="45" y="72" class="h" font-size="56">Wire<tspan fill="url(#brand)">Assume</tspan> Analysis Flow</text><text x="48" y="108" class="s" font-size="17" letter-spacing="4">FROM REAL TRAFFIC TO VERIFIED CONSUMER REQUIREMENTS</text><text x="1095" y="72" class="s" font-size="15" letter-spacing="3">OBSERVE → MUTATE → MEASURE → INFER → DOCUMENT</text></g>
<!-- top row steps 1-4 -->
<g class="t">
<g transform="translate(35 170)"><rect width="190" height="235" rx="18" class="box"/><circle cx="95" cy="0" r="22" class="n"/><text x="95" y="7" text-anchor="middle" class="l" font-size="18">1</text><text x="95" y="62" text-anchor="middle" class="l" font-size="20">Configure scenario</text><text x="95" y="94" text-anchor="middle" class="m">Target provider, consumer,</text><text x="95" y="116" text-anchor="middle" class="m">oracle, and mutation policy</text><path d="M74 150h42v42H74Z" fill="none" stroke="#28c9ff" stroke-width="3"/><path d="M82 161h26M82 171h20M82 181h15" stroke="#28c9ff" stroke-width="3"/></g>
<g transform="translate(255 170)"><rect width="190" height="235" rx="18" class="box"/><circle cx="95" cy="0" r="22" class="n"/><text x="95" y="7" text-anchor="middle" class="l" font-size="18">2</text><text x="95" y="62" text-anchor="middle" class="l" font-size="20">Record live traffic</text><text x="95" y="94" text-anchor="middle" class="m">Capture real requests</text><text x="95" y="116" text-anchor="middle" class="m">and responses</text><circle cx="75" cy="172" r="9" fill="#28c9ff"/><path d="M89 172h12l9-19 14 38 12-19h20" fill="none" stroke="#71dfff" stroke-width="4"/></g>
<g transform="translate(475 170)"><rect width="190" height="235" rx="18" class="box"/><circle cx="95" cy="0" r="22" class="n"/><text x="95" y="7" text-anchor="middle" class="l" font-size="18">3</text><text x="95" y="62" text-anchor="middle" class="l" font-size="20">Normalize &amp; redact</text><text x="95" y="94" text-anchor="middle" class="m">Canonicalize corpus;</text><text x="95" y="116" text-anchor="middle" class="m">remove sensitive data</text><ellipse cx="95" cy="158" rx="25" ry="9" fill="none" stroke="#28c9ff" stroke-width="3"/><path d="M70 158v38c0 12 50 12 50 0v-38" fill="none" stroke="#28c9ff" stroke-width="3"/></g>
<g transform="translate(695 170)"><rect width="190" height="235" rx="18" class="box"/><circle cx="95" cy="0" r="22" class="n"/><text x="95" y="7" text-anchor="middle" class="l" font-size="18">4</text><text x="95" y="62" text-anchor="middle" class="l" font-size="20">Run baseline replay</text><text x="95" y="94" text-anchor="middle" class="m">Verify unmodified traffic</text><text x="95" y="116" text-anchor="middle" class="m">works before mutation</text><path d="M77 151 122 176 77 201Z" fill="#28c9ff"/></g>
</g>
<path d="M225 287H249" class="line"/><path d="M445 287H469" class="line"/><path d="M665 287H689" class="line"/>
<!-- loop zone -->
<rect x="920" y="135" width="645" height="330" rx="24" fill="#041c33" stroke="#20bdf5" stroke-width="2" stroke-dasharray="7 8"/>
<g class="t"><text x="1030" y="165" fill="#20c9ff" font-size="14" font-weight="700" letter-spacing="2">REPEAT UNTIL MUTATIONS ARE EXHAUSTED</text></g>
<g class="t">
<g transform="translate(950 205)"><rect width="175" height="180" rx="18" class="box"/><circle cx="88" cy="0" r="22" class="n"/><text x="88" y="7" text-anchor="middle" class="l" font-size="18">5</text><text x="88" y="57" text-anchor="middle" class="l" font-size="18">Generate one</text><text x="88" y="82" text-anchor="middle" class="l" font-size="18">mutation at a time</text><text x="88" y="115" text-anchor="middle" class="m">Change one thing</text><text x="88" y="136" text-anchor="middle" class="m">per iteration</text><path d="M55 154h25l14 12 14-12h20M55 174h25l14-12 14 12h20" fill="none" stroke="#28c9ff" stroke-width="3"/></g>
<g transform="translate(1150 205)"><rect width="175" height="180" rx="18" class="box"/><circle cx="88" cy="0" r="22" class="n"/><text x="88" y="7" text-anchor="middle" class="l" font-size="18">6</text><text x="88" y="57" text-anchor="middle" class="l" font-size="18">Replay mutated</text><text x="88" y="82" text-anchor="middle" class="l" font-size="18">response</text><text x="88" y="115" text-anchor="middle" class="m">Send controlled response</text><text x="88" y="136" text-anchor="middle" class="m">to the real consumer</text><path d="M72 150 116 173 72 196Z" fill="#28c9ff"/></g>
</g>
<path d="M885 287H944" class="line"/><path d="M1125 295H1144" class="line"/><path d="M1325 295H1360" class="line"/>
<!-- oracle diamond and outcomes -->
<g class="t"><path d="M1420 205 1510 295 1420 385 1330 295Z" fill="#062a49" stroke="#59dbff" stroke-width="2.5"/><circle cx="1420" cy="246" r="19" fill="none" stroke="#28c9ff" stroke-width="3"/><text x="1420" y="253" text-anchor="middle" fill="#28c9ff" font-size="24" font-weight="800">?</text><text x="1420" y="295" text-anchor="middle" class="l" font-size="20">Oracle result?</text><text x="1420" y="322" text-anchor="middle" class="m">How did consumer behave?</text></g>
<!-- bottom outcomes legend -->
<g class="t"><rect x="1180" y="405" width="110" height="42" rx="12" fill="#0b403e" stroke="#28e0b8"/><text x="1235" y="432" text-anchor="middle" fill="#72ffd7" font-weight="800">PASS</text><rect x="1310" y="405" width="110" height="42" rx="12" fill="#442033" stroke="#ff668e"/><text x="1365" y="432" text-anchor="middle" fill="#ff8ca9" font-weight="800">FAIL</text><rect x="1440" y="405" width="108" height="42" rx="12" fill="#453b16" stroke="#ffd84d"/><text x="1494" y="432" text-anchor="middle" fill="#ffe778" font-weight="800">INCONCLUSIVE</text></g>
<path d="M1510 295H1545V450H1040V391" fill="none" stroke="#28c9ff" stroke-width="2.2" marker-end="url(#a)"/><g class="t"><text x="1160" y="447" class="s" font-size="13" letter-spacing="2">NEXT MUTATION</text></g>
<!-- lower row -->
<g class="t">
<g transform="translate(35 530)"><rect width="205" height="220" rx="18" class="box"/><circle cx="103" cy="0" r="22" class="n"/><text x="103" y="7" text-anchor="middle" class="l" font-size="18">8</text><text x="103" y="58" text-anchor="middle" class="l" font-size="19">Collect evidence</text><text x="103" y="91" text-anchor="middle" class="m">Store requests, responses,</text><text x="103" y="113" text-anchor="middle" class="m">oracle results, timing</text><path d="M79 145h48v50H79Z" fill="none" stroke="#28c9ff" stroke-width="3"/><path d="M88 158h30M88 170h30M88 182h22" stroke="#28c9ff" stroke-width="3"/></g>
<g transform="translate(270 530)"><rect width="205" height="220" rx="18" class="box"/><circle cx="103" cy="0" r="22" class="n"/><text x="103" y="7" text-anchor="middle" class="l" font-size="18">9</text><text x="103" y="58" text-anchor="middle" class="l" font-size="19">Delta-debug behavior</text><text x="103" y="91" text-anchor="middle" class="m">Minimize decisive field set</text><text x="103" y="113" text-anchor="middle" class="m">through the real oracle</text><circle cx="94" cy="164" r="22" fill="none" stroke="#67dcff" stroke-width="4"/><path d="m110 181 22 22" stroke="#67dcff" stroke-width="5"/></g>
<g transform="translate(505 530)"><rect width="205" height="220" rx="18" class="box"/><circle cx="103" cy="0" r="22" class="n"/><text x="103" y="7" text-anchor="middle" class="l" font-size="18">10</text><text x="103" y="58" text-anchor="middle" class="l" font-size="19">Infer requirement</text><text x="103" y="91" text-anchor="middle" class="m">Only decisive FAIL-driven</text><text x="103" y="113" text-anchor="middle" class="m">evidence becomes dependency</text><circle cx="103" cy="159" r="18" fill="none" stroke="#67dcff" stroke-width="3"/><path d="M93 178h20M96 186h14" stroke="#67dcff" stroke-width="3"/></g>
<g transform="translate(740 530)"><rect width="205" height="220" rx="18" class="box"/><circle cx="103" cy="0" r="22" class="n"/><text x="103" y="7" text-anchor="middle" class="l" font-size="18">11</text><text x="103" y="58" text-anchor="middle" class="l" font-size="19">Compare OpenAPI</text><text x="103" y="91" text-anchor="middle" class="m">Classify guaranteed,</text><text x="103" y="113" text-anchor="middle" class="m">undocumented, contradicted</text><path d="M82 145h42v50H82Z" fill="none" stroke="#28c9ff" stroke-width="3"/><path d="m90 174 9 9 18-22" fill="none" stroke="#6be9ff" stroke-width="3"/></g>
<g transform="translate(975 530)"><rect width="205" height="220" rx="18" class="box"/><circle cx="103" cy="0" r="22" class="n"/><text x="103" y="7" text-anchor="middle" class="l" font-size="18">12</text><text x="103" y="58" text-anchor="middle" class="l" font-size="19">Emit lock &amp; reports</text><text x="103" y="91" text-anchor="middle" class="m">Machine + human artifacts</text><text x="103" y="113" text-anchor="middle" class="m">with stable evidence refs</text><path d="M82 145h42v50H82Z" fill="none" stroke="#28c9ff" stroke-width="3"/><path d="M90 158h26M90 170h26M90 182h18" stroke="#28c9ff" stroke-width="3"/></g>
</g>
<path d="M240 640H264" class="line"/><path d="M475 640H499" class="line"/><path d="M710 640H734" class="line"/><path d="M945 640H969" class="line"/>
<!-- outcomes -->
<g class="t"><rect x="1220" y="530" width="340" height="220" rx="20" class="box"/><text x="1390" y="562" text-anchor="middle" fill="#28c9ff" font-size="14" font-weight="700" letter-spacing="4">OUTPUTS</text><rect x="1240" y="585" width="300" height="42" rx="10" class="step"/><text x="1260" y="612" class="l" font-size="17">consumption.lock</text><rect x="1240" y="640" width="300" height="42" rx="10" class="step"/><text x="1260" y="667" class="l" font-size="17">HTML / Markdown / JSON / YAML</text><rect x="1240" y="695" width="300" height="42" rx="10" class="step"/><text x="1260" y="722" class="l" font-size="17">Pact export + contract diff/history</text></g>
<path d="M1180 640H1214" class="line"/>
<!-- explanatory labels -->
<g class="t"><text x="1185" y="785" fill="#79d7ff" font-size="15">PASS → tolerated behavior</text><text x="1185" y="810" fill="#ff8aa9" font-size="15">FAIL → evidence of dependency</text><text x="1185" y="835" fill="#ffe36b" font-size="15">INCONCLUSIVE → never infer dependency</text><text x="45" y="850" class="s" font-size="13" letter-spacing="3">CONSUMER BEHAVIOR → EVIDENCE → REQUIREMENTS</text></g>
</svg>
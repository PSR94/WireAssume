name: Integrate static reporting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply reporting integration patch
        run: python3 scripts/integrate_reporting.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Prove static report end to end
        run: |
          cargo build --workspace --locked
          cd demo
          rm -rf .wireassume/runs .wireassume/evidence consumption.lock.yml
          ../target/debug/wireassume --config wireassume.yml analyze --scenario customer-profile --source-revision demo-v1
          python3 verify_demo.py
      - name: Commit validated reporting integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/contract-engine/src/lib.rs crates/contract-engine/src/html.rs crates/cli/src/main.rs demo/verify_demo.py demo/README.md docs/project-status.md
          if git diff --cached --quiet; then
            echo "No reporting integration changes to commit."
            exit 0
          fi
          git commit -m "feat(report): emit self-contained HTML analysis report"
          git push

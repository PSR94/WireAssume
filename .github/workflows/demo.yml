name: OrbitDesk demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  customer-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Analyze OrbitDesk with WireAssume action
        id: wireassume
        uses: ./
        with:
          working-directory: demo
          config: wireassume.yml
          scenario: customer-profile
          source-revision: demo-v1

      - name: Verify action outputs
        env:
          REPORT_DIRECTORY: ${{ steps.wireassume.outputs.report-directory }}
          LOCKFILE: ${{ steps.wireassume.outputs.lockfile }}
          MARKDOWN_REPORT: ${{ steps.wireassume.outputs.markdown-report }}
          HTML_REPORT: ${{ steps.wireassume.outputs.html-report }}
        run: |
          test -d "$REPORT_DIRECTORY"
          test -f "$LOCKFILE"
          test -f "$MARKDOWN_REPORT"
          test -f "$HTML_REPORT"

      - name: Verify experimentally inferred contract
        working-directory: demo
        run: python3 verify_demo.py

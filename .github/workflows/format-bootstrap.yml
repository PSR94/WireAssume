name: Bootstrap rustfmt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Commit validated rustfmt output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          bad=$(git diff --cached --name-only | grep -v '\.rs$' || true)
          if [ -n "$bad" ]; then
            echo "Refusing to commit non-Rust formatter changes:"
            echo "$bad"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No rustfmt changes to commit."
            exit 0
          fi
          git commit -m "style: apply rustfmt across workspace"
          git push

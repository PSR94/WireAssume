name: Refresh README banner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/banner-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct verified generated banner
        shell: bash
        run: |
          set -euo pipefail
          cat .wireassume-banner-exact/p*.b64 > /tmp/wireassume-banner.b64
          test "$(wc -c < /tmp/wireassume-banner.b64)" -eq 24856
          base64 --decode /tmp/wireassume-banner.b64 > docs/assets/readme/wireassume-banner.webp
          echo "4b1e7051b7beb4ea2564429eac5001ff7314f45dcd546f5a0582475889fc783b  docs/assets/readme/wireassume-banner.webp" | sha256sum -c -
          test -s docs/assets/readme/wireassume-banner.webp
          file docs/assets/readme/wireassume-banner.webp | grep -q 'Web/P image'

      - name: Update README placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = 'docs/assets/readme/wireassume-banner.svg'
          new = 'docs/assets/readme/wireassume-banner.webp'
          if old not in text:
              raise SystemExit(f'missing expected README banner reference: {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q 'docs/assets/readme/wireassume-banner.webp' README.md
          ! grep -q 'docs/assets/readme/wireassume-banner.svg' README.md

      - name: Commit final banner and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/assets/readme/wireassume-banner.svg
          rm -rf .wireassume-banner-staging .wireassume-banner-exact
          rm -f .github/workflows/banner-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: replace README banner with corrected generated artwork'
          git push origin HEAD:main

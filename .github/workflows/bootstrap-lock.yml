name: Bootstrap lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply known Clippy fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/contract-engine/src/lib.rs")
          text = path.read_text()
          old = '''    let score = if total_weight == 0 {
              0
          } else {
              ((passed_weight * 100 + total_weight / 2) / total_weight).min(100) as u8
          };'''
          new = '''    let score = (passed_weight * 100 + total_weight / 2)
              .checked_div(total_weight)
              .unwrap_or(0)
              .min(100) as u8;'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected resilience-score source pattern was not found")
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Commit validated bootstrap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/contract-engine/src/lib.rs
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "fix(core): make workspace reproducible and clippy-clean"
          git push

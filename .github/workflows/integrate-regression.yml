name: Integrate contract regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Apply regression integration patch
        run: python3 scripts/integrate_regression.py

      - name: Refresh lockfile
        run: cargo check --workspace

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate real OrbitDesk contract through action
        id: wireassume
        uses: ./
        with:
          working-directory: demo
          config: wireassume.yml
          scenario: customer-profile
          source-revision: regression-e2e

      - name: Verify demo, diff, history, and Pact export
        working-directory: demo
        env:
          REPORT_DIRECTORY: ${{ steps.wireassume.outputs.report-directory }}
        run: |
          set -euo pipefail
          python3 verify_demo.py
          binary="../target/release/wireassume"
          head_lock="$REPORT_DIRECTORY/consumption.lock.json"

          "$binary" diff "$head_lock" "$head_lock" --json --fail-on-breaking > "$REPORT_DIRECTORY/no-change.diff.json"

          python3 - "$head_lock" /tmp/wireassume-base.json <<'PY'
          import json, sys
          source, target = sys.argv[1:]
          data = json.load(open(source, encoding="utf-8"))
          data["metadata"]["source_revision"]["value"] = "baseline-without-hidden-dependencies"
          data["requirements"] = []
          data["assumptions"] = []
          data["evidence"] = []
          json.dump(data, open(target, "w", encoding="utf-8"))
          PY

          set +e
          "$binary" diff /tmp/wireassume-base.json "$head_lock" --json --fail-on-breaking > "$REPORT_DIRECTORY/breaking.diff.json"
          status=$?
          set -e
          test "$status" -ne 0
          python3 - "$REPORT_DIRECTORY/breaking.diff.json" <<'PY'
          import json, sys
          diff = json.load(open(sys.argv[1], encoding="utf-8"))
          assert diff["breaking"] is True
          assert len(diff["added_assumptions"]) >= 2
          PY

          "$binary" export-pact "$head_lock" --output "$REPORT_DIRECTORY/pact.json"
          python3 - "$REPORT_DIRECTORY/pact.json" <<'PY'
          import json, sys
          pact = json.load(open(sys.argv[1], encoding="utf-8"))
          assert pact["consumer"]["name"] == "OrbitDesk"
          assert pact["provider"]["name"] == "PeopleCRM"
          assert pact["metadata"]["pactSpecification"]["version"] == "3.0.0"
          assert pact["interactions"][0]["response"]["body"]["email"] == "wireassume-example"
          PY

          "$binary" history --workspace .wireassume --json > "$REPORT_DIRECTORY/history.json"
          python3 - "$REPORT_DIRECTORY/history.json" <<'PY'
          import json, sys
          history = json.load(open(sys.argv[1], encoding="utf-8"))
          assert history
          assert history[-1]["assumption_ids"]
          PY

      - name: Commit validated regression integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/contract-engine/src/lib.rs crates/contract-engine/src/diff.rs crates/contract-engine/src/pact.rs crates/cli/Cargo.toml crates/cli/src/main.rs action.yml README.md CHANGELOG.md docs/github-action.md docs/project-status.md
          if git diff --cached --quiet; then
            echo "No regression integration changes to commit."
            exit 0
          fi
          git commit -m "feat(ci): add deterministic contract regression checks and Pact export"
          git push

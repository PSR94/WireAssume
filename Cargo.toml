[workspace]
members = [
  "crates/model",
  "crates/config",
  "crates/normalizer",
  "crates/mutation-engine",
  "crates/delta-debugger",
  "crates/oracles",
  "crates/replay",
  "crates/proxy",
  "crates/experiment",
  "crates/contract-engine",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"
authors = ["WireAssume contributors"]
repository = "https://github.com/PSR94/WireAssume"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["http1", "http2"] }
bytes = "1.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

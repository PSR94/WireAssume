[workspace]
members = [
  "crates/model",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
authors = ["WireAssume contributors"]
repository = "https://github.com/PSR94/WireAssume"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
url = "2.5"
tracing = "0.1"
